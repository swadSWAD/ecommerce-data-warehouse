<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>电商数仓 · 经营数据看板</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background:#f4f6f9; color:#1f2d3d; padding:24px;
  }
  .wrap { max-width:1280px; margin:0 auto; }
  header { margin-bottom:20px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:0; }
  .sub { font-size:13px; color:#7a8899; margin-top:6px; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:20px; }
  .kpi {
    background:#fff; border:1px solid #e4e9f0; border-radius:8px;
    padding:20px 22px;
  }
  .kpi .label { font-size:13px; color:#7a8899; margin-bottom:10px; }
  .kpi .value { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .unit { font-size:14px; color:#7a8899; margin-left:4px; font-weight:400; }
  .kpi.a .value { color:#2563eb; }
  .kpi.b .value { color:#0891b2; }
  .kpi.c .value { color:#059669; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .card {
    background:#fff; border:1px solid #e4e9f0; border-radius:8px; padding:16px 18px;
  }
  .card h2 { font-size:15px; font-weight:600; margin-bottom:4px; }
  .card .hint { font-size:12px; color:#9aa7b5; margin-bottom:10px; }
  #province { height:430px; }
  #sku { height:430px; }
  footer { margin-top:20px; font-size:12px; color:#9aa7b5; text-align:center; }
  @media (max-width:900px){ .kpis,.charts{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>电商数仓 · 经营数据看板</h1>
    <div class="sub">统计日期 2026-06-23 &nbsp;|&nbsp; 数据来源：Hive ODS → DWD → DWS → ADS</div>
  </header>

  <div class="kpis">
    <div class="kpi a"><div class="label">GMV 成交总额</div>
      <div class="value">1,325,297<span class="unit">元</span></div></div>
    <div class="kpi b"><div class="label">订单量</div>
      <div class="value">187<span class="unit">单</span></div></div>
    <div class="kpi c"><div class="label">下单用户数</div>
      <div class="value">135<span class="unit">人</span></div></div>
  </div>

  <div class="charts">
    <div class="card">
      <h2>各省份销售金额 Top 15</h2>
      <div class="hint">单位：元</div>
      <div id="province"></div>
    </div>
    <div class="card">
      <h2>热门商品销售额 Top 10</h2>
      <div class="hint">单位：元</div>
      <div id="sku"></div>
    </div>
  </div>

  <footer>电商数据仓库项目 · Hadoop / Hive / Maxwell / Flume / DolphinScheduler</footer>
</div>

<script>
const provinceData = [
["新疆",125161.30],["江苏",102749.30],["广东",83110.00],["湖北",73239.20],["山西",69063.10],
["黑龙江",66811.30],["吉林",59307.10],["天津",57629.10],["重庆",55920.20],["台湾",53435.20],
["山东",48302.10],["上海",44567.10],["湖南",42491.10],["河北",41207.10],["河南",39179.00]
];

const skuData = [
["联想拯救者Y9000P i9-12900H RTX3070Ti",165736.00],
["联想拯救者Y9000P i7-12700H RTX3060",135287.00],
["TCL 85Q6 85英寸电视",97191.90],
["联想拯救者Y9000P i9-12900H RTX3060",88091.00],
["TCL 75Q10 75英寸电视",74511.90],
["小米12S Ultra 12+512G 冷杉绿",73489.00],
["小米12S Ultra 12+256G 经典黑",67989.00],
["联想拯救者Y9000P i7-12700H 512G",67593.00],
["Apple iPhone 12 64GB 红色",65576.00],
["小米电视E65X 65英寸",60879.00]
];

const pChart = echarts.init(document.getElementById('province'));
pChart.setOption({
  grid:{ left:10, right:20, top:20, bottom:10, containLabel:true },
  tooltip:{ trigger:'axis', axisPointer:{type:'shadow'},
    valueFormatter: v => v.toLocaleString('zh-CN') + ' 元' },
  xAxis:{ type:'value', splitLine:{lineStyle:{color:'#eef2f7'}},
    axisLabel:{ color:'#7a8899', fontSize:11,
      formatter: v => (v/10000).toFixed(0) + '万' } },
  yAxis:{ type:'category', inverse:true,
    data: provinceData.map(d=>d[0]),
    axisLine:{lineStyle:{color:'#e4e9f0'}}, axisTick:{show:false},
    axisLabel:{ color:'#4a5568', fontSize:12 } },
  series:[{
    type:'bar', data: provinceData.map(d=>d[1]),
    itemStyle:{ color:'#2563eb', borderRadius:[0,4,4,0] },
    barWidth:'58%',
    label:{ show:true, position:'right', fontSize:11, color:'#7a8899',
      formatter: p => (p.value/10000).toFixed(1) + '万' }
  }]
});

const sChart = echarts.init(document.getElementById('sku'));
sChart.setOption({
  grid:{ left:10, right:60, top:20, bottom:10, containLabel:true },
  tooltip:{ trigger:'axis', axisPointer:{type:'shadow'},
    valueFormatter: v => v.toLocaleString('zh-CN') + ' 元' },
  xAxis:{ type:'value', splitLine:{lineStyle:{color:'#eef2f7'}},
    axisLabel:{ color:'#7a8899', fontSize:11,
      formatter: v => (v/10000).toFixed(0) + '万' } },
  yAxis:{ type:'category', inverse:true,
    data: skuData.map(d=>d[0]),
    axisLine:{lineStyle:{color:'#e4e9f0'}}, axisTick:{show:false},
    axisLabel:{ color:'#4a5568', fontSize:11, width:150, overflow:'truncate' } },
  series:[{
    type:'bar', data: skuData.map(d=>d[1]),
    itemStyle:{ color:'#0891b2', borderRadius:[0,4,4,0] },
    barWidth:'58%',
    label:{ show:true, position:'right', fontSize:11, color:'#7a8899',
      formatter: p => (p.value/10000).toFixed(1) + '万' }
  }]
});

window.addEventListener('resize', ()=>{ pChart.resize(); sChart.resize(); });
</script>
</body>
</html>
