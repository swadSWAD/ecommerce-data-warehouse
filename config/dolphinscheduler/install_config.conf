# ---------------------------------------------------------
# INSTALL MACHINE
# ---------------------------------------------------------
ips="hadoop103,hadoop104"
sshPort="22"
masters="hadoop103"
workers="hadoop103:default,hadoop104:default"
alertServer="hadoop103"
apiServers="hadoop103"
pythonGatewayServers="hadoop103"
installPath="/opt/module/ds"
deployUser="atguigu"
dataBasedirPath="/tmp/dolphinscheduler"

# ---------------------------------------------------------
# DolphinScheduler ENV
# ---------------------------------------------------------
javaHome="/opt/module/jdk1.8.0_212"
apiServerPort="12345"

# ---------------------------------------------------------
# Database
# ---------------------------------------------------------
DATABASE_TYPE="mysql"
SPRING_DATASOURCE_URL="jdbc:mysql://hadoop102:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&useSSL=false"
SPRING_DATASOURCE_USERNAME="root"
SPRING_DATASOURCE_PASSWORD="YOUR_MYSQL_PASSWORD"

# ---------------------------------------------------------
# Registry Server
# ---------------------------------------------------------
registryPluginName="zookeeper"
registryServers="hadoop102:2181,hadoop103:2181,hadoop104:2181"
registryNamespace="dolphinscheduler"

# ---------------------------------------------------------
# Worker Task Server
# ---------------------------------------------------------
taskPluginDir="lib/plugin/task"
resourceStorageType="HDFS"
resourceUploadPath="/dolphinscheduler"
defaultFS="hdfs://hadoop102:8020"
resourceManagerHttpAddressPort="8088"
yarnHaIps=""
singleYarnIp="hadoop102"
hdfsRootUser="atguigu"

kerberosStartUp="false"
sudoEnable="false"
workerTenantAutoCreate="false"
